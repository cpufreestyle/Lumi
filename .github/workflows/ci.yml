name: CI

# 门禁与 harness.md 一一对应（CI 实跑两条，Swift 那条只在本机跑）：
#   node-server  = harness 第 2 步（npm test，期望 51 pass / 0 fail）
#   windows-app  = Windows 端编译门禁（tsc + vite，只做类型检查与产物构建，不打包 NSIS/不签名）
#   harness 第 1 步（swift build + swift test，621 tests）暂不进 CI，实测分两段：
#   ① runs-on: macos-26（run 42255217688）—— 该标签没有 runner，job 停在 queued，
#      最终 conclusion=cancelled / steps=0。
#   ② runs-on: macos-latest（探针 run 42256803568）—— 被正常调度并跑完 7 个 step，
#      解析 SDK 与 swift build 都成功，swift test 失败：Executed 621 tests, with 3 failures。
#      本机同一套用例 0 failures，同批两条 ubuntu 门禁 19s/23s 全绿。
#   所以卡点是那台镜像上的 3 个环境相关用例，不是标签、token 或网络；在拿到失败用例名之前
#   留在 CI 只会让 workflow 常红，先退回本机执行。详见 harness.md「更正（2026-11-07 首跑实测）」。
# 两条全绿 + 本机 Swift 门禁通过才视为可合并；本地跑法见 harness.md，行为契约见 spec.md。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-server:
    name: Node 后端（npm test）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          npm ci

      - name: npm test
        shell: bash
        run: |
          set -euo pipefail
          npm test

  windows-app:
    name: Windows 端编译（tsc + vite）
    # 只验证类型检查与产物能构建；NSIS 打包/签名需要 Windows runner 与证书，不在本门禁内。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: npm ci
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          cd windows
          npm ci

      - name: 主进程 tsc
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          cd windows
          npm run build:main

      - name: 渲染进程 vite build
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          cd windows
          npm run build:renderer
