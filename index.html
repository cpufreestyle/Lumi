<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumi</title>
<style>
:root {
  --bg: #0d0d14;
  --surface: #181825;
  --surface2: #1e1e2e;
  --border: rgba(255,255,255,0.08);
  --text: #e8e8f0;
  --text2: #a0a0b8;
  --text3: #585870;
  --accent: #fa586a;
  --accent2: #ff6b81;
  --accent-rgb: 250, 88, 106;
  --radius: 22px;
  --radius-sm: 14px;
  --font: 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-user-select: none;
  user-select: none;
}

/* ===== Dynamic Island (Notch) ===== */
.dynamic-island {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Collapsed state */
.island-collapsed {
  height: 44px;
  width: 160px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 0 8px;
  cursor: pointer;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03) inset;
  overflow: hidden;
}
.island-collapsed:hover {
  transform: scale(1.03);
  box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06) inset;
}
.island-collapsed .mini-cover {
  width: 28px; height: 28px;
  border-radius: 7px;
  object-fit: cover;
  flex-shrink: 0;
}
.island-collapsed .mini-info {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}
.island-collapsed .mini-title {
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}
.island-collapsed .mini-artist {
  font-size: 9px;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}
.island-collapsed .mini-wave {
  display: flex;
  align-items: flex-end;
  gap: 1.5px;
  height: 14px;
  flex-shrink: 0;
}
.island-collapsed .mini-wave .mw-bar {
  width: 2.5px;
  border-radius: 1px;
  background: var(--accent);
  transition: height 0.08s linear;
}

/* Expanded state */
.island-expanded {
  width: 380px;
  height: 480px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  box-shadow: 0 16px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04) inset;
  overflow: hidden;
  animation: islandExpand 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes islandExpand {
  from { opacity: 0.8; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.island-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 8px;
}
.island-header .ih-logo {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 6px;
}
.island-header .ih-logo span {
  background: linear-gradient(135deg, var(--accent), #ff9a9e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.island-header .ih-close {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: none;
  color: var(--text2);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
}
.island-header .ih-close:hover { background: rgba(255,255,255,0.12); color: #fff; }

.island-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 0 18px;
  overflow: hidden;
}

/* Album Art */
.art-section {
  display: flex;
  justify-content: center;
  padding: 6px 0 14px;
}
.art-wrapper {
  position: relative;
  width: 160px; height: 160px;
}
.art-cover {
  width: 100%; height: 100%;
  border-radius: 16px;
  object-fit: cover;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  transition: transform 0.4s ease;
}
.art-cover.playing {
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.art-glow {
  position: absolute;
  inset: -6px;
  border-radius: 22px;
  background: radial-gradient(circle, rgba(var(--accent-rgb),0.25) 0%, transparent 70%);
  filter: blur(18px);
  z-index: -1;
  opacity: 0.7;
}

/* Track Info */
.info-section {
  text-align: center;
  padding: 0 8px;
}
.info-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.info-artist {
  font-size: 13px;
  color: var(--text2);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Progress */
.progress-section {
  margin-top: 14px;
  padding: 0 4px;
}
.progress-bar {
  position: relative;
  height: 5px;
  background: var(--surface2);
  border-radius: 3px;
  cursor: pointer;
  overflow: visible;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 3px;
  position: relative;
  transition: width 0.15s linear;
}
.progress-fill::after {
  content: '';
  position: absolute;
  right: -6px;
  top: 50%;
  transform: translateY(-50%);
  width: 13px; height: 13px;
  background: #fff;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.2s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.progress-bar:hover .progress-fill::after { opacity: 1; }
.progress-times {
  display: flex;
  justify-content: space-between;
  margin-top: 5px;
  font-size: 10px;
  color: var(--text3);
  font-variant-numeric: tabular-nums;
}

/* Controls */
.controls-section {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 12px;
}
.ctrl-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text2);
  transition: 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}
.ctrl-btn:hover { color: #fff; transform: scale(1.1); }
.ctrl-btn:active { transform: scale(0.92); }
.ctrl-btn.skip svg { width: 18px; height: 18px; }
.ctrl-btn.play-pause {
  width: 50px; height: 50px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}
.ctrl-btn.play-pause:hover {
  background: rgba(var(--accent-rgb), 0.25);
  box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.3);
}
.ctrl-btn.play-pause svg { width: 22px; height: 22px; color: #fff; }
.ctrl-btn.secondary svg { width: 16px; height: 16px; }

/* Volume Row */
.volume-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
}
.vol-icon {
  font-size: 14px;
  cursor: pointer;
  color: var(--text2);
  transition: 0.2s;
}
.vol-icon:hover { color: #fff; }
.vol-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100px;
  height: 3px;
  background: var(--surface2);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
}

/* Visualizer */
.visualizer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.5px;
  height: 32px;
  margin-top: 10px;
}
.viz-bar {
  width: 3px;
  min-height: 3px;
  border-radius: 1.5px;
  background: var(--accent);
  transition: height 0.06s linear;
}
.viz-bar:nth-child(odd) { background: rgba(var(--accent-rgb), 0.6); }
.viz-bar:nth-child(3n) { background: var(--accent2); }

/* Lyrics */
.lyrics-section {
  flex: 1;
  margin-top: 10px;
  overflow-y: auto;
  min-height: 0;
  border-top: 1px solid var(--border);
  padding-top: 8px;
}
.lyrics-section::-webkit-scrollbar { width: 3px; }
.lyrics-section::-webkit-scrollbar-track { background: transparent; }
.lyrics-section::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }
.lyric-line {
  padding: 4px 12px;
  color: var(--text3);
  font-size: 13px;
  transition: 0.35s;
  text-align: center;
  cursor: pointer;
  border-radius: 6px;
  line-height: 1.5;
}
.lyric-line.active {
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  background: rgba(var(--accent-rgb), 0.08);
}
.lyric-line:hover { color: var(--text2); }
.lyrics-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 60px;
  color: var(--text3);
  font-size: 12px;
}

/* ===== Login Prompt ===== */
.login-prompt {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px;
  text-align: center;
  max-width: 400px;
  box-shadow: 0 16px 64px rgba(0,0,0,0.6);
}
.login-card h2 {
  font-size: 24px;
  margin-bottom: 8px;
}
.login-card h2 span {
  background: linear-gradient(135deg, var(--accent), #ff9a9e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.login-card p {
  color: var(--text2);
  font-size: 14px;
  margin-bottom: 24px;
}
.login-card .note {
  font-size: 11px;
  color: var(--text3);
  margin-top: 16px;
  line-height: 1.6;
}
.login-card .note a {
  color: var(--accent);
  text-decoration: none;
}
.login-card .note a:hover { text-decoration: underline; }

.btn {
  padding: 12px 28px;
  border-radius: 24px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  font-family: var(--font);
  transition: 0.3s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  box-shadow: 0 4px 20px rgba(var(--accent-rgb), 0.35);
}
.btn-primary:hover { transform: scale(1.04); box-shadow: 0 6px 28px rgba(var(--accent-rgb), 0.5); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-secondary {
  background: var(--surface2);
  color: var(--text2);
  border: 1px solid var(--border);
  margin-top: 8px;
}
.btn-secondary:hover { color: #fff; }

/* Demo mode banner */
.demo-banner {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 998;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 8px 18px;
  font-size: 12px;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.demo-banner .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #fbbf24;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* Toast */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 22px;
  border-radius: 24px;
  font-size: 13px;
  z-index: 2000;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* Album search */
.search-section {
  display: flex;
  gap: 8px;
  padding: 0 4px;
  margin-top: 8px;
}
.search-input {
  flex: 1;
  padding: 8px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  outline: none;
}
.search-input::placeholder { color: var(--text3); }
.search-input:focus { border-color: var(--accent); }
.search-btn {
  padding: 8px 16px;
  border-radius: 20px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text2);
  cursor: pointer;
  font-size: 13px;
  font-family: var(--font);
  white-space: nowrap;
  transition: 0.2s;
}
.search-btn:hover { color: #fff; border-color: var(--accent); }

.search-results {
  max-height: 120px;
  overflow-y: auto;
  margin-top: 4px;
  border-radius: var(--radius-sm);
}
.search-results::-webkit-scrollbar { width: 3px; }
.search-results::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }
.search-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  cursor: pointer;
  border-radius: 10px;
  transition: 0.15s;
}
.search-item:hover { background: var(--surface2); }
.search-item .si-cover {
  width: 36px; height: 36px;
  border-radius: 6px;
  object-fit: cover;
  flex-shrink: 0;
}
.search-item .si-info {
  flex: 1;
  min-width: 0;
}
.search-item .si-title {
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.search-item .si-artist {
  font-size: 11px;
  color: var(--text3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
</head>
<body>

<!-- Dynamic Island -->
<div class="dynamic-island" id="dynamicIsland">
  <!-- Collapsed State -->
  <div class="island-collapsed" id="islandCollapsed" onclick="expandIsland()">
    <img class="mini-cover" id="miniCover" src="" alt="">
    <div class="mini-info">
      <div class="mini-title" id="miniTitle">未在播放</div>
      <div class="mini-artist" id="miniArtist">点击展开</div>
    </div>
    <div class="mini-wave" id="miniWave"></div>
  </div>

  <!-- Expanded State (hidden by default) -->
  <div class="island-expanded" id="islandExpanded" style="display:none;">
    <div class="island-header">
      <div class="ih-logo"><span>🎵 Lumi</span> Lumi</div>
      <button class="ih-close" onclick="collapseIsland()">✕</button>
    </div>
    <div class="island-body">
      <!-- Search -->
      <div class="search-section">
        <input class="search-input" id="searchInput" placeholder="搜索 Apple Music 歌曲..." onkeydown="if(event.key==='Enter')searchAppleMusic()">
        <button class="search-btn" onclick="searchAppleMusic()">搜索</button>
      </div>
      <div class="search-results" id="searchResults"></div>

      <!-- Album Art -->
      <div class="art-section">
        <div class="art-wrapper">
          <div class="art-glow" id="artGlow"></div>
          <img class="art-cover" id="artCover" src="" alt="封面">
        </div>
      </div>

      <!-- Track Info -->
      <div class="info-section">
        <div class="info-title" id="infoTitle">未在播放</div>
        <div class="info-artist" id="infoArtist">搜索歌曲开始播放</div>
      </div>

      <!-- Progress -->
      <div class="progress-section">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="progress-times">
          <span id="currentTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-section">
        <button class="ctrl-btn skip" onclick="skipBack()" title="上一首">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play-pause" id="playPauseBtn" onclick="togglePlay()">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn skip" onclick="skipForward()" title="下一首">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <!-- Volume -->
      <div class="volume-row">
        <span class="vol-icon" id="volIcon" onclick="toggleMute()">🔊</span>
        <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="70" oninput="setVolume(this.value)">
      </div>

      <!-- Visualizer -->
      <div class="visualizer" id="visualizer"></div>

      <!-- Lyrics -->
      <div class="lyrics-section" id="lyricsSection">
        <div class="lyrics-empty" id="lyricsEmpty">暂无歌词</div>
      </div>
    </div>
  </div>
</div>

<!-- Login Prompt -->
<div class="login-prompt" id="loginPrompt">
  <div class="login-card" id="loginCard">
    <h2><span>Lumi</span> Lumi</h2>
    <p>动态岛 · Apple Music 播放器</p>
    
    <!-- Step 1: Auto-detect -->
    <div id="loginStepAuto" style="display:none;">
      <div style="margin-bottom:16px;">
        <div id="configStatusText" style="font-size:13px;color:var(--text2);margin-bottom:8px;">检测凭据中...</div>
        <div id="configStatusDot" style="width:40px;height:40px;border-radius:50%;background:var(--surface2);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:20px;animation:pulse 1.5s infinite;">⋯</div>
      </div>
      <button class="btn btn-primary" id="connectBtn" onclick="connectAppleMusic()">
        🎵 连接 Apple Music
      </button>
      <button class="btn btn-secondary" onclick="useDemoMode()">
        试用演示模式
      </button>
    </div>

    <!-- Step 2: Setup credentials -->
    <div id="loginStepSetup" style="display:none;">
      <div class="note" style="margin-bottom:16px;text-align:left;line-height:1.8;">
        <b>配置 Apple Developer 凭据：</b><br>
        1. 前往 <a href="https://developer.apple.com/account/" target="_blank">Apple Developer</a><br>
        2. Keys → 创建 MusicKit Key<br>
        3. 下载 .p8 私钥并填入下方
      </div>
      <div class="modal-form-group" style="margin-bottom:10px;text-align:left;">
        <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:3px;">Team ID（10位数字）</label>
        <input class="search-input" id="setupTeamId" placeholder="如 12A3B456C7" style="width:100%;">
      </div>
      <div class="modal-form-group" style="margin-bottom:10px;text-align:left;">
        <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:3px;">Key ID（10位字符）</label>
        <input class="search-input" id="setupKeyId" placeholder="如 ABCD123456" style="width:100%;">
      </div>
      <div class="modal-form-group" style="margin-bottom:14px;text-align:left;">
        <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:3px;">私钥（.p8 文件全部内容）</label>
        <textarea class="search-input" id="setupPrivateKey" placeholder="-----BEGIN PRIVATE KEY-----
...
-----END PRIVATE KEY-----" style="width:100%;height:80px;resize:vertical;font-family:monospace;font-size:11px;"></textarea>
      </div>
      <button class="btn btn-primary" id="setupSaveBtn" onclick="saveCredentials()" style="width:100%;margin-bottom:6px;">
        保存凭据并连接
      </button>
      <button class="btn btn-secondary" onclick="useDemoMode()">
        先试用演示模式
      </button>
    </div>

    <!-- Step 3: Connect buttons (when configured) -->
    <div id="loginStepReady" style="display:none;">
      <button class="btn btn-primary" id="connectBtnReady" onclick="connectAppleMusic()">
        🎵 连接 Apple Music
      </button>
      <button class="btn btn-secondary" onclick="showSetupForm()">
        重新配置凭据
      </button>
      <button class="btn btn-secondary" onclick="useDemoMode()">
        试用演示模式
      </button>
    </div>

    <div class="note" style="margin-top:16px;">
      需要 Apple Music 订阅才能播放完整歌曲。<br>
      <a href="https://developer.apple.com/musickit/" target="_blank">关于 MusicKit →</a>
    </div>
  </div>
</div>

<!-- Demo Banner -->
<div class="demo-banner" id="demoBanner" style="display:none;">
  <span class="dot"></span> 演示模式 · 播放30秒预览
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://js-cdn.music.apple.com/musickit/v1/musickit.js"></script>
<script>
// ============ State ============
const state = {
  isExpanded: false,
  isPlaying: false,
  isMuted: false,
  volume: 0.7,
  currentTrack: null,
  currentTime: 0,
  duration: 0,
  lyrics: [],
  demoMode: false,
};

// ============ MusicKit Instance ============
let music = null;
let audioCtx = null;
let analyser = null;
let animationId = null;

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

// ============ Init ============
async function init() {
  createVisualizerBars();
  createMiniWaveBars();
  setupEventListeners();
  setupAudioContext();
  
  // Check demo mode first
  if (localStorage.getItem('lumi_demo') === 'true') {
    useDemoMode();
    return;
  }

  // If configured, auto-connect
  const status = await checkBackendConfig();
  if (status.configured) {
    showReadyState();
    // Auto-connect after a brief delay for MusicKit to load
    setTimeout(() => connectAppleMusic(), 800);
  } else {
    showSetupState();
  }
}

async function checkBackendConfig() {
  try {
    const res = await fetch('/api/config-status');
    if (res.ok) return await res.json();
  } catch(e) {}
  // If backend isn't running, show setup form
  return { configured: false };
}

function showSetupState() {
  $('#loginStepAuto').style.display = 'none';
  $('#loginStepReady').style.display = 'none';
  $('#loginStepSetup').style.display = 'block';
}

function showReadyState() {
  $('#loginStepAuto').style.display = 'none';
  $('#loginStepSetup').style.display = 'none';
  $('#loginStepReady').style.display = 'block';
}

function showAutoDetecting() {
  $('#loginStepAuto').style.display = 'block';
  $('#loginStepSetup').style.display = 'none';
  $('#loginStepReady').style.display = 'none';
}

function setupAudioContext() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  analyser.smoothingTimeConstant = 0.85;
}

function setupEventListeners() {
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    switch (e.code) {
      case 'Space': e.preventDefault(); togglePlay(); break;
      case 'ArrowLeft': e.preventDefault(); skipBack(); break;
      case 'ArrowRight': e.preventDefault(); skipForward(); break;
      case 'ArrowUp': e.preventDefault(); adjustVolume(5); break;
      case 'ArrowDown': e.preventDefault(); adjustVolume(-5); break;
      case 'Escape': collapseIsland(); break;
    }
  });

  // Click outside to collapse
  document.addEventListener('click', (e) => {
    if (state.isExpanded && !$('#dynamicIsland').contains(e.target)) {
      collapseIsland();
    }
  });

  // Progress bar click
  $('#progressBar').addEventListener('click', (e) => {
    if (!state.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    seekTo(ratio * state.duration);
  });
}

// ============ Apple Music Connection ============
async function connectAppleMusic() {
  const btn = $('#connectBtn') || $('#connectBtnReady');
  if (btn) {
    btn.disabled = true;
    btn.textContent = '正在连接...';
  }

  try {
    // Get developer token from backend
    let devToken;
    try {
      const res = await fetch('/api/token');
      if (res.ok) {
        const data = await res.json();
        devToken = data.token;
        console.log('[Token] 从后端获取令牌成功');
      } else {
        const err = await res.json();
        throw new Error(err.error || '无法获取令牌');
      }
    } catch (tokenErr) {
      console.warn('[Token] 后端获取失败:', tokenErr.message);
      showToast('凭据未配置，请在下方填写 Apple Developer 凭据');
      showSetupState();
      if (btn) {
        btn.disabled = false;
        btn.textContent = '🎵 连接 Apple Music';
      }
      return;
    }

    // Configure MusicKit
    await MusicKit.configure({
      developerToken: devToken,
      app: {
        name: 'Lumi',
        build: '1.0.0',
      },
    });

    music = MusicKit.getInstance();
    
    // Authorize user
    await music.authorize();
    
    // Setup event listeners
    music.addEventListener('playbackStateDidChange', onPlaybackStateChange);
    music.addEventListener('nowPlayingItemDidChange', onNowPlayingChange);
    music.addEventListener('playbackProgressDidChange', onProgressChange);
    music.addEventListener('mediaItemDidChange', onMediaItemChange);

    state.demoMode = false;
    localStorage.removeItem('lumi_demo');
    $('#loginPrompt').style.display = 'none';
    $('#demoBanner').style.display = 'none';
    
    // Show the island
    showToast('✅ Apple Music 已连接');
    collapseIsland();
    
    // Wire up real MusicKit handlers
    setupMusicKitHandlers();
    
    // Auto-play if there's a queue
    try {
      const np = music.nowPlayingItem;
      if (np) updateTrackDisplay(np);
    } catch(e) {}
    
  } catch (err) {
    console.error('MusicKit error:', err);
    if (btn) {
      btn.disabled = false;
      btn.textContent = '🎵 连接 Apple Music';
    }
    
    if (err.message && err.message.includes('token')) {
      showToast('令牌无效，请检查 Apple Developer 凭据');
      showSetupState();
    } else if (err.message && err.message.includes('authorize')) {
      showToast('Apple Music 授权失败，请在弹窗中登录');
    } else {
      showToast('连接失败: ' + (err.message || '请重试'));
    }
  }
}

function setupMusicKitHandlers() {
  // Real Apple Music event handlers
  onPlaybackStateChange = (e) => {
    if (e.state === 2 || e.state === 3) {
      state.isPlaying = true;
      try {
        // Connect audio to analyser for real MusicKit
        const audioEl = document.querySelector('audio');
        if (audioEl && !audioEl._analyzerConnected) {
          const source = audioCtx.createMediaElementSource(audioEl);
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          audioEl._analyzerConnected = true;
        }
      } catch(e) {}
    } else {
      state.isPlaying = false;
    }
    updatePlayButton();
  };

  onNowPlayingChange = (e) => {
    if (e.item) {
      updateTrackDisplay(e.item);
      // Fetch lyrics
      const name = e.item.attributes?.name || e.item.title || '';
      const artist = e.item.attributes?.artistName || e.item.artist || '';
      if (name) fetchLyrics(name, artist);
    }
  };

  onProgressChange = (e) => {
    state.currentTime = e.currentPlaybackTime || 0;
    state.duration = e.currentPlaybackDuration || 0;
    updateProgress();
    updateLyricsHighlight();
    updateMiniWave();
  };

  onMediaItemChange = (e) => {
    if (e.item) updateTrackDisplay(e.item);
  };
}

async function saveCredentials() {
  const teamId = $('#setupTeamId').value.trim();
  const keyId = $('#setupKeyId').value.trim();
  const privateKey = $('#setupPrivateKey').value.trim();
  
  if (!teamId || !keyId || !privateKey) {
    showToast('请填写所有字段');
    return;
  }

  const btn = $('#setupSaveBtn');
  btn.disabled = true;
  btn.textContent = '保存中...';

  try {
    const res = await fetch('/api/setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ teamId, keyId, privateKey }),
    });
    
    const data = await res.json();
    
    if (data.success) {
      showToast('✅ 凭据已保存！正在连接 Apple Music...');
      showReadyState();
      // Auto-connect
      setTimeout(() => connectAppleMusic(), 500);
    } else {
      showToast('保存失败: ' + (data.error || '请重试'));
      btn.disabled = false;
      btn.textContent = '保存凭据并连接';
    }
  } catch (err) {
    showToast('保存失败: 无法连接到服务器');
    btn.disabled = false;
    btn.textContent = '保存凭据并连接';
  }
}

function showSetupForm() {
  showSetupState();
}

function useDemoMode() {
  state.demoMode = true;
  localStorage.setItem('lumi_demo', 'true');
  $('#loginPrompt').style.display = 'none';
  $('#demoBanner').style.display = 'flex';
  
  // Setup demo player
  setupDemoPlayer();
  collapseIsland();
  showToast('🎧 演示模式已启动，搜索歌曲即可试听');
}

// ============ Demo Player (without MusicKit) ============
function setupDemoPlayer() {
  // Use the Apple Music preview API (30s previews)
  music = {
    _queue: [],
    _index: -1,
    _audio: new Audio(),
    _eventHandlers: {},
    
    get nowPlayingItem() {
      return this._queue[this._index] || null;
    },
    
    addEventListener(event, handler) {
      if (!this._eventHandlers[event]) this._eventHandlers[event] = [];
      this._eventHandlers[event].push(handler);
    },
    
    _emit(event, data) {
      (this._eventHandlers[event] || []).forEach(h => h(data));
    },
    
    async search(query) {
      // Use iTunes Search API for demo (returns 30s previews)
      const url = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=10&lang=zh_cn`;
      const res = await fetch(url);
      const data = await res.json();
      return data.results.map(r => ({
        id: r.trackId.toString(),
        attributes: {
          name: r.trackName,
          artistName: r.artistName,
          albumName: r.collectionName,
          artwork: { url: r.artworkUrl100.replace('100x100', '400x400') },
          previews: [{ url: r.previewUrl }],
          durationInMillis: r.trackTimeMillis,
          url: r.trackViewUrl,
        },
      }));
    },
    
    async setQueue({ song }) {
      this._queue = [song];
      this._index = 0;
      this._playCurrent();
    },
    
    _playCurrent() {
      const item = this._queue[this._index];
      if (!item) return;
      
      const previewUrl = item.attributes?.previews?.[0]?.url;
      if (!previewUrl) {
        showToast('暂无预览可用');
        return;
      }
      
      // Connect audio to analyser
      if (!this._sourceConnected) {
        try {
          const source = audioCtx.createMediaElementSource(this._audio);
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
          this._sourceConnected = true;
        } catch(e) {}
      }
      
      this._audio.src = previewUrl;
      this._audio.play().then(() => {
        this._emit('playbackStateDidChange', { state: 2 }); // playing
        this._emit('nowPlayingItemDidChange', { item });
      }).catch(e => console.warn('Play failed:', e));
      
      this._setupAudioEvents();
    },
    
    _setupAudioEvents() {
      this._audio.ontimeupdate = () => {
        const progress = {
          currentPlaybackTime: this._audio.currentTime,
          currentPlaybackDuration: this._audio.duration,
        };
        this._emit('playbackProgressDidChange', progress);
        state.currentTime = this._audio.currentTime;
        state.duration = this._audio.duration;
        updateProgress();
        updateLyricsHighlight();
        updateMiniWave();
      };
      
      this._audio.onended = () => {
        this._emit('playbackStateDidChange', { state: 0 }); // stopped
        skipForward();
      };
      
      this._audio.onplay = () => {
        state.isPlaying = true;
        updatePlayButton();
        startVisualizer();
        $('#artCover').classList.add('playing');
      };
      
      this._audio.onpause = () => {
        state.isPlaying = false;
        updatePlayButton();
        stopVisualizer();
        $('#artCover').classList.remove('playing');
      };
    },
    
    async play() {
      if (this._audio.src) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        await this._audio.play();
      } else if (this._queue[this._index]) {
        this._playCurrent();
      }
    },
    
    pause() { this._audio.pause(); },
    
    async skipToNextItem() {
      if (this._queue.length > 0) {
        this._index = (this._index + 1) % this._queue.length;
        this._playCurrent();
      }
    },
    
    async skipToPreviousItem() {
      if (this._audio.currentTime > 3) {
        this._audio.currentTime = 0;
        return;
      }
      if (this._queue.length > 0) {
        this._index = (this._index - 1 + this._queue.length) % this._queue.length;
        this._playCurrent();
      }
    },
    
    seekToTime(time) { this._audio.currentTime = time; },
    
    get volume() { return this._audio.volume; },
    set volume(v) { this._audio.volume = v; },
  };
  
  // Wire up MusicKit event handlers
  onPlaybackStateChange = (e) => {
    if (e.state === 2) { // playing
      state.isPlaying = true;
    } else {
      state.isPlaying = false;
    }
    updatePlayButton();
  };
  
  onNowPlayingChange = (e) => {
    if (e.item) updateTrackDisplay(e.item);
  };
  
  onProgressChange = (e) => {
    state.currentTime = e.currentPlaybackTime;
    state.duration = e.currentPlaybackDuration;
    updateProgress();
    updateLyricsHighlight();
    updateMiniWave();
  };
  
  onMediaItemChange = (e) => {
    if (e.item) updateTrackDisplay(e.item);
  };
}

// MusicKit event handlers (set by connection)
let onPlaybackStateChange, onNowPlayingChange, onProgressChange, onMediaItemChange;

// ============ Island Expand/Collapse ============
function expandIsland() {
  state.isExpanded = true;
  $('#islandCollapsed').style.display = 'none';
  $('#islandExpanded').style.display = 'flex';
  $('#dynamicIsland').style.top = '40px';
}

function collapseIsland() {
  state.isExpanded = false;
  $('#islandCollapsed').style.display = 'flex';
  $('#islandExpanded').style.display = 'none';
  $('#dynamicIsland').style.top = '20px';
  $('#searchResults').innerHTML = '';
}

// ============ Search ============
async function searchAppleMusic() {
  const query = $('#searchInput').value.trim();
  if (!query) return;
  
  if (!music) {
    showToast('请先连接 Apple Music 或使用演示模式');
    return;
  }
  
  try {
    $('#searchResults').innerHTML = '<div style="padding:12px;text-align:center;color:var(--text3);font-size:12px;">搜索中...</div>';
    
    const results = await music.search(query);
    
    if (!results || results.length === 0) {
      $('#searchResults').innerHTML = '<div style="padding:12px;text-align:center;color:var(--text3);font-size:12px;">未找到结果</div>';
      return;
    }
    
    $('#searchResults').innerHTML = results.map(r => {
      const name = r.attributes?.name || '';
      const artist = r.attributes?.artistName || '';
      const artwork = r.attributes?.artwork?.url || '';
      return `
        <div class="search-item" onclick="playSearchResult('${r.id}')">
          <img class="si-cover" src="${artwork}" alt="" onerror="this.style.display='none'">
          <div class="si-info">
            <div class="si-title">${name}</div>
            <div class="si-artist">${artist}</div>
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    console.error('Search error:', err);
    $('#searchResults').innerHTML = '<div style="padding:12px;text-align:center;color:var(--accent);font-size:12px;">搜索失败，请重试</div>';
  }
}

async function playSearchResult(id) {
  if (!music) return;
  
  try {
    if (state.demoMode) {
      // In demo mode, search for the specific track
      const query = $('#searchInput').value.trim();
      const results = await music.search(query);
      const song = results.find(r => r.id === id);
      if (song) {
        await music.setQueue({ song });
        fetchLyrics(song.attributes?.name, song.attributes?.artistName);
        updateTrackDisplay(song);
      }
    } else {
      // Real MusicKit: set queue with song
      await music.setQueue({ song: id });
      await music.play();
    }
    
    $('#searchResults').innerHTML = '';
    showToast('开始播放');
  } catch (err) {
    console.error('Play error:', err);
    showToast('播放失败，请重试');
  }
}

// ============ Playback Controls ============
async function togglePlay() {
  if (!music) {
    showToast('请先连接 Apple Music 或使用演示模式');
    return;
  }
  
  try {
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    
    if (state.isPlaying) {
      await music.pause();
    } else {
      await music.play();
    }
  } catch (err) {
    console.error('Toggle play error:', err);
  }
}

async function skipForward() {
  if (!music) return;
  try {
    await music.skipToNextItem();
  } catch(e) { console.warn('Skip error:', e); }
}

async function skipBack() {
  if (!music) return;
  try {
    await music.skipToPreviousItem();
  } catch(e) { console.warn('Skip error:', e); }
}

function seekTo(time) {
  if (!music) return;
  try {
    music.seekToTime(time);
  } catch(e) {}
}

function setVolume(val) {
  state.volume = val / 100;
  state.isMuted = false;
  if (music) music.volume = state.volume;
  updateVolumeIcon();
}

function toggleMute() {
  state.isMuted = !state.isMuted;
  if (music) music.volume = state.isMuted ? 0 : state.volume;
  updateVolumeIcon();
}

function adjustVolume(delta) {
  const newVal = Math.max(0, Math.min(100, (state.volume * 100) + delta));
  setVolume(newVal);
  $('#volSlider').value = newVal;
}

function updateVolumeIcon() {
  const icon = $('#volIcon');
  if (state.isMuted || (music && music.volume === 0)) {
    icon.textContent = '🔇';
  } else if (state.volume < 0.5) {
    icon.textContent = '🔉';
  } else {
    icon.textContent = '🔊';
  }
}

// ============ Track Display ============
function updateTrackDisplay(item) {
  if (!item) return;
  
  const attrs = item.attributes || {};
  const name = attrs.name || '未知歌曲';
  const artist = attrs.artistName || '未知艺术家';
  const artwork = attrs.artwork?.url || '';
  
  state.currentTrack = item;
  state.duration = attrs.durationInMillis ? attrs.durationInMillis / 1000 : 0;
  
  // Update expanded view
  $('#infoTitle').textContent = name;
  $('#infoArtist').textContent = artist;
  if (artwork) {
    $('#artCover').src = artwork;
    $('#miniCover').src = artwork;
  } else {
    $('#artCover').src = '';
    $('#miniCover').src = '';
  }
  
  // Update collapsed view
  $('#miniTitle').textContent = name;
  $('#miniArtist').textContent = artist;
  
  // Update page title
  document.title = `${name} - ${artist} · Lumi`;
  
  // Update art glow
  updateArtGlow(artwork);
  
  // Fetch lyrics
  fetchLyrics(name, artist);
}

function updateArtGlow(artworkUrl) {
  // Use a subtle accent glow
  const glow = $('#artGlow');
  glow.style.background = `radial-gradient(circle, rgba(var(--accent-rgb),0.3) 0%, transparent 70%)`;
}

// ============ Lyrics ============
async function fetchLyrics(title, artist) {
  // Try LRCLIB API for synced lyrics
  try {
    const res = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}`);
    if (res.ok) {
      const data = await res.json();
      if (data.syncedLyrics) {
        state.lyrics = parseLRC(data.syncedLyrics);
        renderLyrics();
        return;
      } else if (data.plainLyrics) {
        state.lyrics = data.plainLyrics.split('\n').filter(l => l.trim()).map((text, i) => ({
          time: i * 4,
          text: text.trim(),
        }));
        renderLyrics();
        return;
      }
    }
  } catch(e) {}
  
  state.lyrics = [];
  renderLyrics();
}

function parseLRC(lrc) {
  const lines = lrc.split('\n');
  const result = [];
  const regex = /\[(\d{2}):(\d{2})(?:[.:](\d{2,3}))?\]\s*(.*)/;
  
  for (const line of lines) {
    const match = line.match(regex);
    if (match) {
      const min = parseInt(match[1]);
      const sec = parseInt(match[2]);
      let ms = 0;
      if (match[3]) {
        ms = match[3].length === 2 ? parseInt(match[3]) * 10 : parseInt(match[3]);
      }
      const time = min * 60 + sec + ms / 1000;
      const text = match[4].trim();
      if (text) result.push({ time, text });
    }
  }
  result.sort((a, b) => a.time - b.time);
  return result;
}

function renderLyrics() {
  const container = $('#lyricsSection');
  const empty = $('#lyricsEmpty');
  
  if (!state.lyrics || state.lyrics.length === 0) {
    container.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'lyrics-empty';
    el.textContent = '暂无歌词';
    el.id = 'lyricsEmpty';
    container.appendChild(el);
    return;
  }
  
  container.innerHTML = state.lyrics.map((l, i) =>
    `<div class="lyric-line" data-index="${i}" data-time="${l.time}" onclick="seekTo(${l.time})">${l.text}</div>`
  ).join('');
}

function updateLyricsHighlight() {
  const lines = $$('.lyric-line');
  if (!lines.length) return;
  
  const currentTime = state.currentTime;
  let activeIdx = -1;
  
  for (let i = state.lyrics.length - 1; i >= 0; i--) {
    if (currentTime >= state.lyrics[i].time) {
      activeIdx = i;
      break;
    }
  }
  
  lines.forEach((line, i) => {
    if (i === activeIdx) {
      line.classList.add('active');
      line.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else {
      line.classList.remove('active');
    }
  });
}

// ============ Visualizer ============
function createVisualizerBars() {
  const container = $('#visualizer');
  for (let i = 0; i < 48; i++) {
    const bar = document.createElement('div');
    bar.className = 'viz-bar';
    container.appendChild(bar);
  }
}

function createMiniWaveBars() {
  const container = $('#miniWave');
  for (let i = 0; i < 5; i++) {
    const bar = document.createElement('div');
    bar.className = 'mw-bar';
    bar.style.height = (Math.random() * 8 + 3) + 'px';
    container.appendChild(bar);
  }
}

function startVisualizer() {
  if (animationId) return;
  
  const bars = $$('.viz-bar');
  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);
  const step = Math.floor(bufferLength / bars.length);
  
  function draw() {
    animationId = requestAnimationFrame(draw);
    analyser.getByteFrequencyData(dataArray);
    
    bars.forEach((bar, i) => {
      const value = dataArray[i * step] || 0;
      const height = Math.max(3, (value / 255) * 30);
      bar.style.height = height + 'px';
      const hue = 350 + (value / 255) * 20;
      bar.style.background = `hsl(${hue}, 80%, ${48 + (value/255)*20}%)`;
    });
  }
  draw();
}

function stopVisualizer() {
  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }
  $$('.viz-bar').forEach(b => { b.style.height = '3px'; });
}

function updateMiniWave() {
  if (!analyser) return;
  const bars = $$('.mw-bar');
  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);
  analyser.getByteFrequencyData(dataArray);
  
  bars.forEach((bar, i) => {
    const idx = Math.floor(i * bufferLength / bars.length);
    const value = dataArray[idx] || 0;
    const height = Math.max(2, (value / 255) * 12);
    bar.style.height = height + 'px';
  });
}

// ============ Progress UI ============
function updateProgress() {
  if (state.duration > 0) {
    const pct = (state.currentTime / state.duration) * 100;
    $('#progressFill').style.width = pct + '%';
    $('#currentTime').textContent = formatTime(state.currentTime);
    $('#totalTime').textContent = formatTime(state.duration);
  }
}

function updatePlayButton() {
  $('#playIcon').style.display = state.isPlaying ? 'none' : 'block';
  $('#pauseIcon').style.display = state.isPlaying ? 'block' : 'none';
}

// ============ Helpers ============
function formatTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

let toastTimer;
function showToast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ============ Init ============
init();
</script>
</body>
</html>
